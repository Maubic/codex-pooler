name: Maubic Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build, e.g. codex-pooler-v0.10.9"
        required: true
        default: "codex-pooler-v0.10.9"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: maubic-docker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Prepare version
        id: prepare
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG#refs/tags/}"

          if [[ ! "$tag" =~ ^codex-pooler-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid tag: $tag"
            echo "Expected format: codex-pooler-v0.10.9"
            exit 1
          fi

          version="${tag#codex-pooler-v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Building:"
          echo "  tag:     $tag"
          echo "  version: $version"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/maubic/codex-pooler
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Codex Pooler
            org.opencontainers.image.description=Managed pools of Codex accounts with OpenAI-compatible client routes
            org.opencontainers.image.source=https://github.com/Maubic/codex-pooler
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
          tags: |
            type=raw,value=${{ steps.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Show published images
        shell: bash
        run: |
          echo "Published:"
          echo "  ghcr.io/maubic/codex-pooler:${{ steps.prepare.outputs.version }}"
          echo "  ghcr.io/maubic/codex-pooler:latest"